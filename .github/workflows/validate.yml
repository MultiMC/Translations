# Checks translations in pull requests (Crowdin's l10n_master PRs included) with the
# same validator release.sh uses. Entries it reports would be dropped (shown in English)
# by the release, so fix them in Crowdin before merging.
name: Validate translations

on:
  pull_request:
    paths:
      - '*.po'
      - 'validate_po.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext
      - name: Validate .po files
        run: python3 validate_po.py *.po
